openapi: 3.1.0
info:
  title: Agrawal Samaj API
  version: 1.0.0
  description: |
    Versioned JSON API for the Agrawal Samaj community application. All resource
    routes are under /v1. Timestamps are ISO-8601 UTC strings and money is in
    paise. Stage 3 surfaces (chat, Friends, Vouch, birthdays and voluntary
    Head Transfer) are intentionally not part of this contract.
servers:
  - url: https://api.example.in
    description: Production placeholder; deployment supplies the real host.
tags:
  - name: Health
  - name: Auth
  - name: Registration
  - name: Payments
  - name: Me
  - name: Families
  - name: Directory
  - name: Media
  - name: Notifications
  - name: Officer
  - name: Notices
  - name: Business Listings
  - name: Blood SOS
  - name: Events
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Process health
      operationId: getHealth
      x-auth: public
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      tags: [Health]
      summary: Dependency readiness
      operationId: getReadiness
      x-auth: public
      security: []
      responses:
        '200':
          description: Database and job queue are reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/auth/session:
    post:
      tags: [Auth]
      summary: Exchange a Firebase phone token for an API session
      operationId: createAuthSession
      x-auth: public
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionRequest'
      responses:
        '201':
          description: Session created. WEB sessions set sid in a secure cookie; MOBILE sessions include token.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly Secure SameSite=Lax sid cookie for WEB clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags: [Auth]
      summary: Revoke the current session
      operationId: deleteAuthSession
      x-auth: principal
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceToken'
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expired sid cookie.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current principal
      operationId: getAuthMe
      x-auth: principal
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Current Applicant or Member principal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrincipalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/registration:
    get:
      tags: [Registration]
      summary: Get the Applicant's current Registration
      operationId: getRegistration
      x-auth: applicant
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Current Registration and payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Registration]
      summary: Abandon or cancel the current Registration
      operationId: cancelRegistration
      x-auth: applicant
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Registration ended and any captured payment was refunded asynchronously.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/registration/payment-order:
    post:
      tags: [Registration, Payments]
      summary: Create the Registration Payment checkout order
      operationId: createRegistrationPaymentOrder
      x-auth: applicant
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Razorpay checkout payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/registration/family-check:
    get:
      tags: [Registration]
      summary: Check whether a Family ID accepts joins
      operationId: checkRegistrationFamily
      x-auth: applicant
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FamilyPublicIdQuery'
      responses:
        '200':
          description: Enumeration-safe Family check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyCheckResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/registration/submit:
    post:
      tags: [Registration]
      summary: Submit a founding or joining Registration
      operationId: submitRegistration
      x-auth: applicant
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationSubmitRequest'
      responses:
        '201':
          description: Founding Registration completed and Member created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoundingRegistrationResponse'
        '202':
          description: Joining Registration awaits the Family Head.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRegistrationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/romanize:
    post:
      tags: [Registration]
      summary: Romanize Devanagari text for confirmation
      operationId: romanizeText
      x-auth: principal
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RomanizeRequest'
      responses:
        '200':
          description: Romanized text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RomanizeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/payments/{paymentId}:
    get:
      tags: [Payments]
      summary: Get a payment visible to its payer
      operationId: getPayment
      x-auth: principal
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: Payment status without Payment Identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payments/{paymentId}/confirm:
    post:
      tags: [Payments]
      summary: Confirm a Razorpay checkout payment
      operationId: confirmPayment
      x-auth: principal
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmRequest'
      responses:
        '200':
          description: Current payment status after server-side Razorpay verification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/webhooks/razorpay:
    post:
      tags: [Payments]
      summary: Receive a signed Razorpay webhook
      operationId: receiveRazorpayWebhook
      x-auth: public
      security: []
      parameters:
        - $ref: '#/components/parameters/RazorpaySignature'
        - $ref: '#/components/parameters/RazorpayEventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Raw Razorpay webhook JSON. Signature verification is over the raw bytes before parsing.
      responses:
        '200':
          description: Event accepted or identified as a replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /v1/families/mine/join-requests:
    get:
      tags: [Families, Registration]
      summary: List pending join requests for the Head's Family
      operationId: listFamilyJoinRequests
      x-auth: head
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated pending join requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequestPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/families/mine/join-requests/{registrationId}/approve:
    post:
      tags: [Families, Registration]
      summary: Approve a pending join request
      operationId: approveJoinRequest
      x-auth: head
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Joiner became a Member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinApprovalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/families/mine/join-requests/{registrationId}/decline:
    post:
      tags: [Families, Registration]
      summary: Decline a pending join request
      operationId: declineJoinRequest
      x-auth: head
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RegistrationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinDeclineRequest'
      responses:
        '200':
          description: Join request declined and payment refund initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinDeclineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/me:
    get:
      tags: [Me]
      summary: Get the signed-in Member's self projection
      operationId: getMe
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Member self projection and account state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Me]
      summary: Update editable Member profile fields
      operationId: updateMe
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdateRequest'
      responses:
        '200':
          description: Updated self projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/me/consents:
    put:
      tags: [Me]
      summary: Change blood-group matching or photo visibility consent
      operationId: updateConsents
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdateRequest'
      responses:
        '200':
          description: Current consent state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentState'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/nominee:
    put:
      tags: [Me]
      summary: Set or clear a same-Family Nominee
      operationId: updateNominee
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NomineeUpdateRequest'
      responses:
        '200':
          description: Updated nominee state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NomineeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/me/nominee-prompt/dismiss:
    post:
      tags: [Me]
      summary: Dismiss the Nominee prompt
      operationId: dismissNomineePrompt
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Prompt dismissed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/photo:
    put:
      tags: [Me, Media]
      summary: Attach or detach the Member photo
      operationId: updateMemberPhoto
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageReferenceRequest'
      responses:
        '200':
          description: Updated self projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /v1/me/officer-messages/{messageId}/read:
    post:
      tags: [Me]
      summary: Mark an Officer message as read
      operationId: readOfficerMessage
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Message marked read.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/erasure:
    post:
      tags: [Me]
      summary: Request Member erasure
      operationId: requestErasure
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErasureRequestBody'
      responses:
        '200':
          description: Self-service erasure executed when enabled and re-authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureResponse'
        '202':
          description: Stage 1 request queued for Officer execution.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErasureResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/families/mine:
    get:
      tags: [Families]
      summary: Get the current Member's Family
      operationId: getMyFamily
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: Family and FAMILY projections for every active Member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFamilyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/families/mine/photo:
    put:
      tags: [Families, Media]
      summary: Attach or detach the Family photo
      operationId: updateFamilyPhoto
      x-auth: head
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageReferenceRequest'
      responses:
        '200':
          description: Family with updated photo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFamilyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/directory/members:
    get:
      tags: [Directory]
      summary: Search the living Member directory
      operationId: searchDirectoryMembers
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/QueryText'
        - $ref: '#/components/parameters/GotraQuery'
        - $ref: '#/components/parameters/CityQuery'
        - $ref: '#/components/parameters/IndianStateQuery'
        - $ref: '#/components/parameters/FamilyPublicIdOptionalQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated SAMAJ projections; archived Members are absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryMemberPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/directory/families/{publicId}:
    get:
      tags: [Directory]
      summary: Get a Family profile
      operationId: getDirectoryFamily
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FamilyPublicId'
      responses:
        '200':
          description: Family and viewer-appropriate Member projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryFamilyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/directory/members/{memberId}:
    get:
      tags: [Directory]
      summary: Get a viewer-appropriate Member projection
      operationId: getDirectoryMember
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: SELF, FAMILY or SAMAJ projection selected by the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/families/mine/invites:
    post:
      tags: [Families]
      summary: Create a Family invite
      operationId: createFamilyInvite
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreateRequest'
      responses:
        '201':
          description: Shareable invite code and URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/invites/{code}:
    get:
      tags: [Families]
      summary: Preview a Family invite
      operationId: getInvite
      x-auth: public
      security: []
      parameters:
        - $ref: '#/components/parameters/InviteCode'
      responses:
        '200':
          description: Enumeration-safe invite preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreviewResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/media/images:
    post:
      tags: [Media]
      summary: Upload and process an image
      operationId: uploadImage
      x-auth: principal
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
      responses:
        '201':
          description: Image uploaded; preview URL is scoped to the uploader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Image exceeds the 8 MB upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: File magic bytes are not a supported image type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /v1/me/devices/{token}:
    put:
      tags: [Notifications]
      summary: Register or move an FCM device token
      operationId: upsertDeviceToken
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceTokenPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Registered device token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Notifications]
      summary: Remove an FCM device token
      operationId: deleteDeviceToken
      x-auth: member
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceTokenPath'
      responses:
        '204':
          description: Device token removed.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/officer/flags:
    get:
      tags: [Officer]
      summary: List Officer flags
      operationId: listOfficerFlags
      x-auth: role(OFFICER)
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/FlagStatusQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Cursor-paginated flags with privacy-safe projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficerFlagPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
