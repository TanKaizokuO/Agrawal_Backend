components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: Mobile session token issued by POST /v1/auth/session.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: Web session cookie issued by POST /v1/auth/session.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID reused by a client when retrying the same state-changing action.
      schema:
        type: string
        format: uuid
    DeviceToken:
      name: X-Device-Token
      in: header
      required: false
      description: FCM token to remove when signing out a mobile session.
      schema:
        type: string
        minLength: 1
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as nextCursor by the previous page.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    FamilyPublicId:
      name: publicId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/FamilyPublicId'
    FamilyPublicIdQuery:
      name: familyPublicId
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/FamilyPublicId'
    FamilyPublicIdOptionalQuery:
      name: familyPublicId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FamilyPublicId'
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RegistrationId:
      name: registrationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ListingId:
      name: listingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BloodSosId:
      name: bloodSosId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PassId:
      name: passId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FlagId:
      name: flagId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuspensionId:
      name: suspensionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArchivalRequestId:
      name: archivalRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9A-HJKMNP-TV-Z]{10}$'
    QueryText:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    GotraQuery:
      name: gotra
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Gotra'
    CityQuery:
      name: city
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    IndianStateQuery:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/IndianState'
    BusinessCategoryQuery:
      name: category
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/BusinessCategoryId'
    BusinessCityQuery:
      name: city
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    OwnerMemberIdQuery:
      name: ownerMemberId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    PhoneQuery:
      name: phone
      in: query
      required: false
      schema:
        type: string
        pattern: '^\+91[6-9][0-9]{9}$'
    NoticeBoardQuery:
      name: board
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/NoticeBoard'
    FlagStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FlagStatus'
        default: OPEN
    ErasureStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [PENDING, EXECUTED, WITHDRAWN]
        default: PENDING
    ImageStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ImageStatus'
    ActiveQuery:
      name: active
      in: query
      required: false
      schema:
        type: boolean
        default: true
    ArchivalStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ArchivalRequestStatus'
        default: ESCALATED
    ReportTargetQuery:
      name: target
      in: query
      required: false
      schema:
        type: string
        enum: [BLOOD_SOS]
        default: BLOOD_SOS
    SubjectIdQuery:
      name: subjectId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    DeviceTokenPath:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
    RazorpaySignature:
      name: X-Razorpay-Signature
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{64}$'
    RazorpayEventId:
      name: x-razorpay-event-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Principal is authenticated but lacks the required relation or role.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource state or uniqueness conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Domain validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit or posting cap exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status, database, jobs]
      properties:
        status:
          type: string
          const: ready
        database:
          type: string
          const: ok
        jobs:
          type: string
          const: ok
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          $ref: '#/components/schemas/Error'
        requestId:
          type: string
          minLength: 1
    Error:
      type: object
      required: [code, message, details]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Server-localized message selected from Accept-Language.
        details:
          type: object
          additionalProperties: true
    ErrorCode:
      type: string
      enum: [VALIDATION_FAILED, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, IDEMPOTENCY_KEY_REUSED, INTERNAL, UPSTREAM_UNAVAILABLE, FIREBASE_TOKEN_INVALID, PHONE_BELONGS_TO_ARCHIVED_MEMBER, SESSION_EXPIRED, PAYMENT_NOT_FOUND, PAYMENT_SIGNATURE_INVALID, PAYMENT_ALREADY_CAPTURED, REGISTRATION_NOT_FOUND, REGISTRATION_WRONG_STATE, REGISTRATION_NOT_PAID, DUPLICATE_HEAD, FAMILY_NOT_FOUND, FAMILY_NOT_ACCEPTING_JOINS, NOT_ADULT, GOTRA_NOT_ALLOWED_FOR_JOIN, GOTRA_REQUIRED, IMAGE_NOT_OWNED, PHONE_ALREADY_REGISTERED, NOMINEE_NOT_IN_FAMILY, NOMINEE_IS_SELF, REAUTH_REQUIRED, MEMBER_NOT_FOUND, NOT_HEAD, IMAGE_TYPE_UNSUPPORTED, IMAGE_TOO_LARGE, IMAGE_REFUSED, IMAGE_NOT_FOUND, FLAG_NOT_FOUND, FLAG_ALREADY_RESOLVED, NOMINEE_READ_NOT_PERMITTED, POSTING_CAP_REACHED, POSTING_SUSPENDED, NOTICE_CONTAINS_PHONE, NOTICE_CONTAINS_BLOCKED_WORD, CANNOT_REPORT_OWN, ALREADY_REPORTED, NOTICE_NOT_FOUND, LISTING_NOT_FOUND, ARCHIVAL_REQUEST_NOT_FOUND, ARCHIVAL_REQUEST_ALREADY_RESOLVED, NOT_FAMILY_MEMBER, SOS_ALREADY_ACTIVE, SOS_NOT_FOUND, SOS_ALREADY_CLOSED, SOS_NOT_REQUESTER, SOS_NOT_ALERTED, GATE_DEVICE_NOT_FOR_EVENT, EVENT_NOT_FOUND, EVENT_NOT_ACTIVE, PASS_ALREADY_EXISTS, PASS_NOT_FOUND, NOT_ORGANISER]
    Money:
      type: object
      required: [amountPaise, currency]
      properties:
        amountPaise:
          type: integer
          minimum: 0
        currency:
          type: string
          const: INR
    BilingualText:
      type: object
      required: [en, hi]
      properties:
        en:
          type: [string, 'null']
          maxLength: 120
        hi:
          type: [string, 'null']
          maxLength: 120
    BilingualNameInput:
      type: object
      minProperties: 1
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[\\p{Script=Latin}\\s.'-]+$"
        hi:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[\\p{Script=Devanagari}\\s.]+$'
    BilingualName:
      allOf:
        - $ref: '#/components/schemas/BilingualText'
    FamilyPublicId:
      type: string
      pattern: '^AGR-[1-9][0-9]{5}-[0-9]{5}$'
      example: AGR-492001-00017
    PhoneE164:
      type: string
      pattern: '^\+91[6-9][0-9]{9}$'
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    CalendarDate:
      type: string
      format: date
    Gotra:
      type: string
      enum: [GARG, GOYAL, GOYAN, BANSAL, KANSAL, SINGHAL, JINDAL, TINGAL, MOHAN, DHARAN, MADHUKUL, BINDAL, MITTAL, TAYAL, MANGAL, AIRAN, NANGAL, KUCHHAL]
    Gender:
      type: string
      enum: [FEMALE, MALE, OTHER]
    BloodGroup:
      type: string
      enum: [A_POS, A_NEG, B_POS, B_NEG, AB_POS, AB_NEG, O_POS, O_NEG]
    IndianState:
      type: string
      enum: [ANDHRA_PRADESH, ARUNACHAL_PRADESH, ASSAM, BIHAR, CHHATTISGARH, GOA, GUJARAT, HARYANA, HIMACHAL_PRADESH, JHARKHAND, KARNATAKA, KERALA, MADHYA_PRADESH, MAHARASHTRA, MANIPUR, MEGHALAYA, MIZORAM, NAGALAND, ODISHA, PUNJAB, RAJASTHAN, SIKKIM, TAMIL_NADU, TELANGANA, TRIPURA, UTTAR_PRADESH, UTTARAKHAND, WEST_BENGAL, ANDAMAN_AND_NICOBAR_ISLANDS, CHANDIGARH, DADRA_AND_NAGAR_HAVELI_AND_DAMAN_AND_DIU, DELHI, JAMMU_AND_KASHMIR, LADAKH, LAKSHADWEEP, PUDUCHERRY]
    NativePlace:
      oneOf:
        - $ref: '#/components/schemas/NativePlaceListed'
        - $ref: '#/components/schemas/NativePlaceOther'
        - $ref: '#/components/schemas/NativePlaceUnknown'
    NativePlaceListed:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          const: LISTED
        id:
          type: string
          enum: [AGROHA_HARYANA, HISAR_HARYANA, BHIWANI_HARYANA, REWARI_HARYANA, NARNAUL_HARYANA, JHUNJHUNU_RAJASTHAN, CHURU_RAJASTHAN, SIKAR_RAJASTHAN, FATEHPUR_SHEKHAWATI_RAJASTHAN, MANDAWA_RAJASTHAN, NAWALGARH_RAJASTHAN, RATANGARH_RAJASTHAN, MEERUT_UTTAR_PRADESH, AGRA_UTTAR_PRADESH]
    NativePlaceOther:
      type: object
      required: [kind, text]
      properties:
        kind:
          type: string
          const: OTHER
        text:
          type: string
          minLength: 1
          maxLength: 120
    NativePlaceUnknown:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: UNKNOWN
    Address:
      type: object
      required: [line1, city, state, pincode]
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          $ref: '#/components/schemas/IndianState'
        pincode:
          type: string
          pattern: '^[1-9][0-9]{5}$'
        district:
          type: [string, 'null']
          maxLength: 80
    ConsentState:
      type: object
      required: [directoryListing, bloodGroupMatching, photoVisible, paymentDisclosureAcknowledged]
      properties:
        directoryListing:
          type: boolean
          const: true
        bloodGroupMatching:
          type: boolean
        photoVisible:
          type: boolean
        paymentDisclosureAcknowledged:
          type: boolean
          const: true
    Role:
      type: string
      enum: [OFFICER, OPERATOR, ORGANISER]
    PrincipalApplicant:
      type: object
      required: [kind, phoneE164, registrationId]
      properties:
        kind:
          type: string
          const: APPLICANT
        phoneE164:
          $ref: '#/components/schemas/PhoneE164'
        registrationId:
          $ref: '#/components/schemas/Uuid'
    PrincipalMember:
      type: object
      required: [kind, phoneE164, memberId, familyPublicId, roles, isHead]
      properties:
        kind:
          type: string
          const: MEMBER
        phoneE164:
          $ref: '#/components/schemas/PhoneE164'
        memberId:
          $ref: '#/components/schemas/Uuid'
        familyPublicId:
          $ref: '#/components/schemas/FamilyPublicId'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        isHead:
          type: boolean
    Principal:
      oneOf:
        - $ref: '#/components/schemas/PrincipalApplicant'
        - $ref: '#/components/schemas/PrincipalMember'
    PrincipalResponse:
      type: object
      required: [principal]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
    AuthSessionRequest:
      type: object
      required: [firebaseIdToken, client]
      properties:
        firebaseIdToken:
          type: string
          minLength: 1
        client:
          type: string
          enum: [WEB, MOBILE]
    AuthSessionResponse:
      type: object
      required: [principal]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        token:
          type: [string, 'null']
          description: Present only for MOBILE clients.
    RegistrationStatus:
      type: string
      enum: [STARTED, PAID, AWAITING_HEAD, COMPLETED, ABANDONED, CANCELLED, DECLINED, EXPIRED]
    RegistrationRoute:
      type: string
      enum: [INDIVIDUAL, CREATE, JOIN]
    PaymentStatus:
      type: string
      enum: [CREATED, CAPTURED, FAILED, REFUND_PENDING, REFUNDED]
    RefundStatus:
      type: string
      enum: [REQUESTED, PROCESSED, FAILED]
    RefundReason:
      type: string
      enum: [DUPLICATE_HEAD, JOIN_DECLINED, JOIN_EXPIRED, REGISTRATION_CANCELLED, REGISTRATION_ABANDONED, PUBLICATION_FAILED, OFFICER]
    RegistrationPaymentSummary:
      type: object
      required: [status, amount]
      properties:
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
    FoundingEligibility:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: [string, 'null']
          enum: [DUPLICATE_HEAD, null]
    RegistrationJoinSummary:
      type: object
      required: [family, expiresAt]
      properties:
        family:
          $ref: '#/components/schemas/FamilyReference'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        declineReason:
          type: [string, 'null']
          maxLength: 200
    RefundSummary:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RefundStatus'
        reason:
          oneOf:
            - $ref: '#/components/schemas/RefundReason'
            - type: 'null'
    RegistrationResponse:
      type: object
      required: [id, status, route, payment, founding, join, refund]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/RegistrationStatus'
        route:
          oneOf:
            - $ref: '#/components/schemas/RegistrationRoute'
            - type: 'null'
        payment:
          oneOf:
            - $ref: '#/components/schemas/RegistrationPaymentSummary'
            - type: 'null'
        founding:
          $ref: '#/components/schemas/FoundingEligibility'
        join:
          oneOf:
            - $ref: '#/components/schemas/RegistrationJoinSummary'
            - type: 'null'
        refund:
          oneOf:
            - $ref: '#/components/schemas/RefundSummary'
            - type: 'null'
    FamilyReference:
      type: object
      required: [publicId, gotra]
      properties:
        publicId:
          $ref: '#/components/schemas/FamilyPublicId'
        gotra:
          $ref: '#/components/schemas/Gotra'
    CheckoutPrefill:
      type: object
      required: [contact]
      properties:
        contact:
          $ref: '#/components/schemas/PhoneE164'
    CheckoutOrder:
      type: object
      required: [paymentId, razorpayOrderId, keyId, amount, prefill, alreadyPaid]
      properties:
        paymentId:
          $ref: '#/components/schemas/Uuid'
        razorpayOrderId:
          type: string
        keyId:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        prefill:
          $ref: '#/components/schemas/CheckoutPrefill'
        alreadyPaid:
          type: boolean
    RegistrationSubmitRequest:
      type: object
      required: [route, uiLanguage, typingScript, name, nameEnConfirmed, fatherOrHusbandName, gender, dateOfBirth, bloodGroup, address, nativePlace, consents, paymentRetentionDisclosureAcknowledged]
      properties:
        route:
          $ref: '#/components/schemas/RegistrationRoute'
        familyPublicId:
          $ref: '#/components/schemas/FamilyPublicId'
        uiLanguage:
          type: string
          enum: [en, hi]
        typingScript:
          type: string
          enum: [en, hi]
        name:
          $ref: '#/components/schemas/BilingualNameInput'
        nameEnConfirmed:
          type: boolean
        fatherOrHusbandName:
          $ref: '#/components/schemas/BilingualNameInput'
        gotra:
          $ref: '#/components/schemas/Gotra'
        gender:
          $ref: '#/components/schemas/Gender'
        dateOfBirth:
          $ref: '#/components/schemas/CalendarDate'
        bloodGroup:
          $ref: '#/components/schemas/BloodGroup'
        address:
          $ref: '#/components/schemas/Address'
        nativePlace:
          $ref: '#/components/schemas/NativePlace'
        kuldevi:
          type: string
          maxLength: 80
        kuldevta:
          type: string
          maxLength: 80
        photoImageId:
          $ref: '#/components/schemas/Uuid'
        familyPhotoImageId:
          $ref: '#/components/schemas/Uuid'
        consents:
          type: object
          required: [directoryListing, bloodGroupMatching, photoVisible]
          properties:
            directoryListing:
              type: boolean
              const: true
            bloodGroupMatching:
              type: boolean
            photoVisible:
              type: boolean
        paymentRetentionDisclosureAcknowledged:
          type: boolean
          const: true
    FoundingRegistrationResponse:
      type: object
      required: [status, memberId, family, completedAt]
      properties:
        status:
          type: string
          const: COMPLETED
        memberId:
          $ref: '#/components/schemas/Uuid'
        family:
          $ref: '#/components/schemas/FamilyReference'
        completedAt:
          $ref: '#/components/schemas/Timestamp'
    JoinRegistrationResponse:
      type: object
      required: [status, family, expiresAt]
      properties:
        status:
          type: string
          const: AWAITING_HEAD
        family:
          $ref: '#/components/schemas/FamilyReference'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    FamilyCheckResponse:
      type: object
      required: [exists]
      properties:
        exists:
          type: boolean
        gotra:
          oneOf:
            - $ref: '#/components/schemas/Gotra'
            - type: 'null'
        acceptingJoins:
          oneOf:
            - type: boolean
            - type: 'null'
    RomanizeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 120
          pattern: '^[\p{Script=Devanagari}\s.]+$'
    RomanizeResponse:
      type: object
      required: [latin]
      properties:
        latin:
          type: string
          minLength: 1
          maxLength: 120
    PaymentPurpose:
      type: string
      enum: [REGISTRATION, BUSINESS_LISTING]
    PaymentResponse:
      type: object
      required: [paymentId, purpose, status, amount, method, capturedAt, refund]
      properties:
        paymentId:
          $ref: '#/components/schemas/Uuid'
        purpose:
          $ref: '#/components/schemas/PaymentPurpose'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        method:
          type: [string, 'null']
        capturedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        refund:
          oneOf:
            - $ref: '#/components/schemas/RefundSummary'
            - type: 'null'
    PaymentConfirmRequest:
      type: object
      required: [razorpayPaymentId, razorpayOrderId, razorpaySignature]
      properties:
        razorpayPaymentId:
          type: string
        razorpayOrderId:
          type: string
        razorpaySignature:
          type: string
    RefundResponse:
      type: object
      required: [paymentId, status, reason, amount]
      properties:
        paymentId:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/RefundStatus'
        reason:
          $ref: '#/components/schemas/RefundReason'
        amount:
          $ref: '#/components/schemas/Money'
    WebhookAcceptedResponse:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
          const: true
    FamilyMemberProjection:
      type: object
      required: [memberId, familyPublicId, name, gotra, city, state, phoneE164, fatherOrHusbandName, isHead, isSelf, photoUrl]
      properties:
        memberId:
          $ref: '#/components/schemas/Uuid'
        familyPublicId:
          $ref: '#/components/schemas/FamilyPublicId'
        name:
          $ref: '#/components/schemas/BilingualName'
        gotra:
          $ref: '#/components/schemas/Gotra'
        city:
          type: string
        state:
          $ref: '#/components/schemas/IndianState'
        phoneE164:
          $ref: '#/components/schemas/PhoneE164'
        fatherOrHusbandName:
          $ref: '#/components/schemas/BilingualName'
        gender:
          $ref: '#/components/schemas/Gender'
        photoUrl:
          type: [string, 'null']
          format: uri
        photoStatus:
          type: [string, 'null']
          enum: [UNSCREENED, APPROVED, REJECTED, REMOVED, null]
        isHead:
          type: boolean
        isSelf:
          type: boolean
        occupation:
          type: [string, 'null']
    SamajMemberProjection:
      type: object
      required: [memberId, familyPublicId, name, gotra, city, state, photoUrl, isHead]
      properties:
        memberId:
          $ref: '#/components/schemas/Uuid'
        familyPublicId:
          $ref: '#/components/schemas/FamilyPublicId'
        name:
          $ref: '#/components/schemas/BilingualName'
        gotra:
          $ref: '#/components/schemas/Gotra'
        city:
          type: string
        state:
          $ref: '#/components/schemas/IndianState'
        photoUrl:
          type: [string, 'null']
          format: uri
        photoStatus:
          type: [string, 'null']
          enum: [UNSCREENED, APPROVED, REJECTED, REMOVED, null]
        isHead:
          type: boolean
        occupation:
          type: [string, 'null']
        businessListingName:
          type: [string, 'null']
    SelfMemberProjection:
      allOf:
        - $ref: '#/components/schemas/FamilyMemberProjection'
        - type: object
          required: [dateOfBirth, address, nativePlace, consents, uiLanguage, nomineeMemberId, bloodGroup]
          properties:
            dateOfBirth:
              $ref: '#/components/schemas/CalendarDate'
            bloodGroup:
              $ref: '#/components/schemas/BloodGroup'
            address:
              $ref: '#/components/schemas/Address'
            nativePlace:
              $ref: '#/components/schemas/NativePlace'
            kuldevi:
              type: [string, 'null']
            kuldevta:
              type: [string, 'null']
            nomineeMemberId:
              type: [string, 'null']
              format: uuid
            nomineePromptPending:
              type: boolean
            consents:
              $ref: '#/components/schemas/ConsentState'
            uiLanguage:
              type: string
              enum: [en, hi]
    FamilySummary:
      type: object
      required: [publicId, gotra, isHead, memberCount]
      properties:
        publicId:
          $ref: '#/components/schemas/FamilyPublicId'
        gotra:
          $ref: '#/components/schemas/Gotra'
        isHead:
          type: boolean
        memberCount:
          type: integer
          minimum: 0
    OfficerMessage:
      type: object
      required: [id, kind, reason, createdAt, readAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
        reason:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        readAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SuspensionSummary:
      type: object
      required: [id, endsAt, reason, noticeId]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        endsAt:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
        noticeId:
          oneOf:
            - $ref: '#/components/schemas/Uuid'
            - type: 'null'
    ErasureStatus:
      type: string
      enum: [PENDING, EXECUTED, WITHDRAWN]
    ErasureSummary:
      type: object
      required: [id, status, requestedAt, executedAt]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        status:
          $ref: '#/components/schemas/ErasureStatus'
        requestedAt:
          $ref: '#/components/schemas/Timestamp'
        executedAt:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MeResponse:
      type: object
      required: [member, family, roles, prompts, officerMessages, suspension, erasureRequest]
      properties:
        member:
          $ref: '#/components/schemas/SelfMemberProjection'
        family:
          $ref: '#/components/schemas/FamilySummary'
        roles:
          type: array
