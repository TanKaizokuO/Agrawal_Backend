name: Deploy agrawal (Self-hosted, Node.js)

on:
  workflow_dispatch:
  push:
    branches:
      - prod

concurrency:
  group: "deploy-agrawal-prod"
  cancel-in-progress: false

env:
  APP_NAME: agrawal
  AWS_REGION: ap-south-1
  SECRET_ID: prod/agrawal/env
  APP_PORT: 3000
  NODE_OPTIONS: --max-old-space-size=1024

jobs:
  deploy:
    name: Build & Deploy
    runs-on: [self-hosted, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify AWS identity (instance role)
        run: aws sts get-caller-identity

      - name: Fetch env from Secrets Manager
        run: |
          set -euo pipefail
          umask 077
          aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --region "$AWS_REGION" \
            --query SecretString \
            --output text \
          | jq 'with_entries(.value |= (if type == "string" then . else tojson end))' > .env.json
          jq -e 'length > 0' .env.json > /dev/null || { echo "::error::secret is empty"; exit 1; }
          echo "Loaded $(jq 'length' .env.json) variables"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          set -euo pipefail
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' .env.json)"
          npm run prisma:generate

      - name: Build App
        run: npm run build

      - name: Run database migrations
        run: |
          set -euo pipefail
          eval "$(jq -r 'to_entries[] | "export \(.key)=\(.value | @sh)"' .env.json)"
          npm run prisma:migrate

      - name: Remove dev dependencies
        run: npm prune --omit=dev

      - name: Sync files to app directory
        run: |
          set -euo pipefail
          TARGET_DIR="$HOME/apps/$APP_NAME"
          mkdir -p "$TARGET_DIR"
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitattributes' \
            ./ "$TARGET_DIR/"
          chmod 600 "$TARGET_DIR/.env.json"

      - name: Deploy with PM2
        run: |
          set -euo pipefail
          TARGET_DIR="$HOME/apps/$APP_NAME"
          cd "$TARGET_DIR"

          ENTRY_FILE=$(node -p "require('./package.json').main || 'index.js'")

          cat > ecosystem.config.cjs <<EOF
          module.exports = {
            apps: [{
              name: "$APP_NAME",
              cwd: "$TARGET_DIR",
              script: "/usr/bin/node",
              args: "$ENTRY_FILE",
              interpreter: "none",
              env: Object.assign({}, require("./.env.json"), { NODE_ENV: "production", PORT: "$APP_PORT" }),
              max_memory_restart: "500M"
            }]
          };
          EOF

          pm2 delete "$APP_NAME" 2>/dev/null || true
          pm2 start ecosystem.config.cjs
          pm2 save

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:$APP_PORT/healthz" && exit 0
            sleep 3
          done
          echo "::error::App did not become healthy"
          echo "----- pm2 describe -----"
          pm2 describe "$APP_NAME" || true
          echo "----- app logs -----"
          pm2 logs "$APP_NAME" --lines 50 --nostream || true
          echo "----- pm2 daemon log -----"
          tail -30 "$HOME/.pm2/pm2.log" || true
          echo "----- listening ports -----"
          sudo ss -ltnp | grep node || true
          exit 1

      - name: Reload Nginx
        run: sudo nginx -t && sudo systemctl reload nginx

      - name: Clean workspace secrets
        if: always()
        run: rm -f .env.json
