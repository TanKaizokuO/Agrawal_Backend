# apps/api/deploy/docker-compose.staging.yml
# Docker Compose stack for api-staging on shared EC2 t3.small
# Reference: docs/backend/architecture.md

services:
  api-staging:
    image: ${IMAGE_URI}
    container_name: agrawal-api-staging
    restart: unless-stopped
    # Environment variables and secrets prepared from AWS SSM Parameter Store
    env_file:
      - .env.staging
    ports:
      # Bound to loopback interface on port 3001; Caddy terminates TLS and proxies here
      - "127.0.0.1:${STAGING_PORT:-3001}:3000"
    logging:
      driver: ${LOG_DRIVER:-json-file}
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  migration-staging:
    image: ${IMAGE_URI}
    container_name: agrawal-api-staging-migration
    profiles:
      - migration
    restart: "no"
    env_file:
      - .env.staging
    command:
      - npx
      - prisma
      - migrate
      - deploy
      - --schema
      - prisma/schema
      - --config
      - prisma.config.ts
